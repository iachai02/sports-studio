[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.1",
    "alembic>=1.18.3",
    "psycopg2-binary>=2.9.11",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
